# Migration 이 «어느 문장에서» 깨지는지 찾는다. **읽기와 되돌리는 재생뿐이다.**
#
# 🔴 **Database 를 바꾸지 않는다.** 재생은 BEGIN 으로 열고 끝에서 반드시 ROLLBACK 하며,
# Migration 이력(`drizzle` 스키마)은 읽기만 한다. 그래서 확인 입력을 요구하지 않는다 —
# 실수로 눌러도 잃을 것이 없다.
#
# 🔴 **이것은 Migrate 워크플로를 대신하지 않는다.** 원인을 찾은 뒤 실제 적용은
# `migrate-production.yml` 로 한다.
name: Diagnose migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: 어디서 깨지는가
    # 🔴 production Secret 으로 실행하는 코드는 보호된 main 의 Commit 으로 한정한다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Migration 용 연결(Session mode)을 그대로 쓴다.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: node .github/scripts/diagnose-migration.mjs
