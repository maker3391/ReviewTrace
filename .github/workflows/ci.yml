# 코드 검증 전용 CI.
#
# 🔴 **배포는 Vercel 이 한다.** 이 워크플로는 배포하지 않는다 — Vercel 은 Git 연동으로
# 스스로 빌드하므로, 여기서 다시 배포하면 같은 커밋을 두 번 빌드하고 배포 주체가 둘로 갈린다.
#
# 🔴 **운영 Supabase 를 쓰지 않는다.** 통합시험은 이 job 안에서 뜨는 PostgreSQL 컨테이너로
# 돈다. 운영 DATABASE_URL 을 Secret 으로 넣지 마라 — 되돌아가는 Transaction 을 쓴다 해도
# 시험이 운영 DB 에 붙을 이유가 없다.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# 같은 브랜치에 연달아 push 하면 앞엣것을 접는다. 마지막 커밋의 결과만 필요하다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest

    services:
      # 🔴 docker-compose.yml 과 같은 image 다. 시험이 도는 PostgreSQL 판이 갈리지 않게 맞춘다.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: code_intelligence
          POSTGRES_PASSWORD: code_intelligence
          POSTGRES_DB: code_intelligence
        ports:
          - 5432:5432
        # 🔴 health check 가 없으면 첫 migration 이 「아직 안 뜬 DB」에 붙어 깨진다.
        options: >-
          --health-cmd "pg_isready -U code_intelligence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 🔴 시험 전용 값이다. 운영 credential 이 아니다.
      DATABASE_URL: postgresql://code_intelligence:code_intelligence@localhost:5432/code_intelligence

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 버전을 여기 적지 않는다 — package.json 의 packageManager(pnpm@11.21.0)를 그대로 따른다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 로컬 개발과 같은 major 다(v24). 올릴 때는 로컬도 함께 올린다.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 🔴 단계를 나눠 둔 이유는 «어디서 깨졌는지»를 GitHub 화면에서 바로 읽기 위해서다.
      # 하나로 묶으면 빨간 표시 하나만 남고 원인을 로그에서 파헤쳐야 한다.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit)
        run: pnpm test

      # 통합시험이 보는 표가 있어야 한다. 시험은 스키마를 만들지 않는다.
      - name: Apply migrations (test database)
        run: pnpm db:migrate

      - name: Test (database integration)
        env:
          DB_INTEGRATION: "true"
        run: pnpm test

      # 🔴 맨 뒤다. `next build` 는 `.next` 를 갈아엎으므로 시험보다 먼저 돌릴 이유가 없고,
      # 앞 단계가 깨졌으면 빌드를 돌릴 이유도 없다.
      - name: Build
        run: pnpm build
